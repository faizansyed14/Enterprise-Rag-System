[project]
name = "rag-model-server"
version = "2.0.0"
description = "Local ONNX model server: embeddings, cross-encoder reranking and pair classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "huggingface-hub>=0.26",
]

[project.scripts]
rag-model-server = "rag_model_server.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_model_server"]

[tool.ruff]
line-length = 120
target-version = "py312"
