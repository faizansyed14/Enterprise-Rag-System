# Edge proxy: the only container with a published port (WEB_PORT, default 3000 -> http://localhost:3000).
#   /api/*   -> the API (server-sent events unbuffered, uploads streamed, long timeouts)
#   /metrics -> never served to the outside (Prometheus scrapes the API on the internal network)
#   the rest -> the web UI
#
# HTTPS: terminate TLS on a load balancer in front of this container, or mount a certificate and add a `listen 443 ssl;`
# server block (see docs/security.md). The names below are resolved through Docker's DNS again every few seconds, so
# recreating the backend or frontend container never leaves nginx pointing at an old address.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;

    client_max_body_size 2g;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_buffering off;            # answers stream token by token
        proxy_request_buffering off;    # uploads go straight through, whatever their size
        proxy_cache off;
        gzip off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }

    location / {
        proxy_pass $frontend;
        proxy_read_timeout 60s;
    }
}
