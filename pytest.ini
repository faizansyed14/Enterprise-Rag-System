[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: needs the test Postgres and Qdrant (skipped with a message when they are not reachable)
    models: needs ONNX model files (RAG_TEST_MODELS_DIR)
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning:pdfminer.*
    ignore::DeprecationWarning:pdfplumber.*
